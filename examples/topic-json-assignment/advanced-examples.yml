---
- name: Advanced JSON Assignment Examples
  hosts: 127.0.0.1
  roles:
    - name: kafka_lib
  vars:
    bootstrap_servers: "localhost:9092,localhost:9093,localhost:9094,localhost:9095"
  
  post_tasks:
    # Example 1: Create a topic with multiple partitions
    - name: "Create topic with 6 partitions and replication factor 3"
      kafka_topic:
        api_version: "2.6.0"
        name: "advanced-topic"
        partitions: 6
        replica_factor: 3
        bootstrap_servers: "{{ bootstrap_servers }}"
        state: "present"

    # Example 2: Drain broker 1005 from all partitions
    - name: "Drain broker 1005 from the topic"
      kafka_topic:
        api_version: "2.6.0"
        name: "advanced-topic"
        bootstrap_servers: "{{ bootstrap_servers }}"
        state: "present"
        json_assignment:
          partitions:
            - topic: "advanced-topic"
              partition: 0
              replicas: [1001, 1002, 1003]
            - topic: "advanced-topic"
              partition: 1
              replicas: [1002, 1003, 1004]
            - topic: "advanced-topic"
              partition: 2
              replicas: [1003, 1004, 1001]
            - topic: "advanced-topic"
              partition: 3
              replicas: [1004, 1001, 1002]
            - topic: "advanced-topic"
              partition: 4
              replicas: [1001, 1003, 1004]
            - topic: "advanced-topic"
              partition: 5
              replicas: [1002, 1004, 1001]

    # Example 3: Rebalance partitions across specific brokers
    - name: "Rebalance partitions for better distribution"
      kafka_topic:
        api_version: "2.6.0"
        name: "advanced-topic"
        bootstrap_servers: "{{ bootstrap_servers }}"
        state: "present"
        json_assignment:
          partitions:
            # Distribute leaders evenly across brokers
            - topic: "advanced-topic"
              partition: 0
              replicas: [1001, 1002, 1003]  # 1001 as leader
            - topic: "advanced-topic"
              partition: 1
              replicas: [1002, 1003, 1004]  # 1002 as leader
            - topic: "advanced-topic"
              partition: 2
              replicas: [1003, 1004, 1001]  # 1003 as leader
            - topic: "advanced-topic"
              partition: 3
              replicas: [1004, 1001, 1002]  # 1004 as leader
            - topic: "advanced-topic"
              partition: 4
              replicas: [1001, 1003, 1004]  # 1001 as leader
            - topic: "advanced-topic"
              partition: 5
              replicas: [1002, 1004, 1001]  # 1002 as leader

    # Example 4: Selective reassignment - only move specific partitions
    - name: "Move only partition 2 and 5 to different brokers"
      kafka_topic:
        api_version: "2.6.0"
        name: "advanced-topic"
        bootstrap_servers: "{{ bootstrap_servers }}"
        state: "present"
        json_assignment:
          partitions:
            - topic: "advanced-topic"
              partition: 2
              replicas: [1004, 1001, 1002]  # Move to different brokers
            - topic: "advanced-topic"
              partition: 5
              replicas: [1003, 1001, 1004]  # Move to different brokers

    # Example 5: Prepare for broker maintenance (move all partitions away)
    - name: "Prepare broker 1001 for maintenance"
      kafka_topic:
        api_version: "2.6.0"
        name: "advanced-topic"
        bootstrap_servers: "{{ bootstrap_servers }}"
        state: "present"
        json_assignment:
          partitions:
            - topic: "advanced-topic"
              partition: 0
              replicas: [1002, 1003, 1004]  # Remove 1001
            - topic: "advanced-topic"
              partition: 1
              replicas: [1002, 1003, 1004]  # Remove 1001
            - topic: "advanced-topic"
              partition: 2
              replicas: [1002, 1003, 1004]  # Remove 1001
            - topic: "advanced-topic"
              partition: 3
              replicas: [1002, 1003, 1004]  # Remove 1001
            - topic: "advanced-topic"
              partition: 4
              replicas: [1002, 1003, 1004]  # Remove 1001
            - topic: "advanced-topic"
              partition: 5
              replicas: [1002, 1003, 1004]  # Remove 1001

    # Verify the final state
    - name: "Get final topic information"
      kafka_info:
        resource: "topic"
        api_version: "2.6.0"
        bootstrap_servers: "{{ bootstrap_servers }}"
      register: final_topics

    - name: "Display final topic configuration"
      debug:
        var: final_topics['ansible_module_results']['advanced-topic']